spring:
  application:
    name: PIApi
  datasource:
    url: jdbc:h2:mem:piapi;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  h2:
    console:
      enabled: true
      path: /h2-console

# Documenta apenas o contrato público da aplicação, sem /error ou console H2.
springdoc:
  paths-to-match: /api/**
  override-with-generic-response: false
  default-produces-media-type: application/json
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method
